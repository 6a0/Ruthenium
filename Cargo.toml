[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# ash master has the Vulkan 1.4.3xx extensions crates.io 0.38 lacks (present_id2/wait2,
# present_timing, anti_lag). Patched so gpu-allocator links the same ash.
[patch.crates-io]
ash = { git = "https://github.com/ash-rs/ash", rev = "80e5856982af6651d56337f9a10e46308145c2d2" }
