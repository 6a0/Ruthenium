name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  content:
    name: No Mojang content
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo xtask check-content

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        run: |
          fail=0
          for c in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $c has no Signed-off-by line (use git commit -s)"
              fail=1
            fi
          done
          exit $fail

  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  exporters:
    name: Exporter bundle and generated tables
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      # Official jars, pinned by SHA-1, as build-time input only: they stay in
      # git-ignored cache/ and are never cached or uploaded.
      - run: cargo xtask fetch-compile-deps
      # Reruns Mojang's data generator from the fetched jar and fails if the
      # committed ruthenium-data tables differ from what it produces.
      - run: cargo xtask codegen --deps cache/compile-deps --check
      # Fails if the bundle holds any class outside dev/ruthenium/.
      - run: cargo xtask exporters --deps cache/compile-deps
      # The development mods (benchmark driver, golden-trace recorder) still
      # compile against the game and the pinned Fabric jars.
      - run: cargo xtask build-mod bench
      - run: cargo xtask build-mod trace
      - uses: actions/upload-artifact@v4
        with:
          name: ruthenium-exporters
          path: target/java/ruthenium-exporters.jar
          if-no-files-found: error

  shaders:
    name: Shaders (pinned glslc)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Only the glslc binary from the pinned Vulkan SDK (Apache-2.0), not the SDK.
      - uses: actions/cache@v4
        with:
          path: cache/glslc
          key: glslc-${{ hashFiles('xtask/src/shaders.rs') }}
      # Recompiles every shader and fails if the committed SPIR-V differs.
      - run: cargo xtask shaders --check

  javamath-jvm:
    # Vanilla builds its sine table with Math.sin, which HotSpot implements
    # with per-architecture intrinsics. Dump the table and ~460k Mth.sin/cos
    # results from a real JVM on x64 and on each ARM64 platform, and compare
    # them bit for bit with ruthenium-javamath on the same machine.
    name: Trig table vs JVM (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
          - { os: macos-15, arch: aarch64 }
          - { os: windows-11-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Microsoft's OpenJDK build, as in Mojang's own Java runtime.
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '25'
      # Official jars, pinned by SHA-1, as build-time input only (git-ignored
      # cache/, never cached or uploaded).
      - run: cargo xtask fetch-compile-deps
      - run: cargo xtask javamath-dump
      - run: cargo test -p ruthenium-javamath --test vanilla
        env:
          RUTHENIUM_JAVAMATH_REQUIRE_DUMP: '1'
          RUTHENIUM_JAVAMATH_EXPECT_ARCH: ${{ matrix.arch }}

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # SDL3 is built from source and linked statically: always on Windows and
      # macOS, and on Linux through this feature (Ubuntu 24.04 has no libsdl3-dev).
      FEATURES: ${{ startsWith(matrix.os, 'ubuntu') && '--features ruthenium/sdl-static' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: SDL3 build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libdrm-dev libgbm-dev libdecor-0-dev libdbus-1-dev libibus-1.0-dev
      - run: cargo clippy --workspace --all-targets $FEATURES
      - run: cargo test --workspace $FEATURES
      # The development-only offline login (PLAN D3) compiles and passes its tests...
      - run: cargo clippy -p ruthenium --all-targets $FEATURES --features ruthenium/dev-offline
      - run: cargo test -p ruthenium $FEATURES --features ruthenium/dev-offline

  release-binary:
    # ...and never reaches a release build: its marker string must be absent.
    name: No dev-offline in release builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: SDL3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libdrm-dev libgbm-dev libdecor-0-dev libdbus-1-dev libibus-1.0-dev
      - run: cargo build --release -p ruthenium --features ruthenium/sdl-static
      - name: Check the binary for the dev-offline marker
        run: |
          if grep -q -a RUTHENIUM-DEV-OFFLINE-BUILD target/release/ruthenium; then
            echo "::error::the release binary contains the dev-offline login"
            exit 1
          fi
