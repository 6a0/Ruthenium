import net.fabricmc.loom.task.prod.ClientProductionRunTask

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	accessWidenerPath = file("src/main/resources/rubidium.accesswidener")

	runs.configureEach {
		// Mojang's launcher JVM arguments (see the benchmark tasks below for why these matter)
		vmArgs("-XX:StackShadowPages=32", "--add-exports", "java.base/jdk.internal.misc=ALL-UNNAMED")
		if (System.getProperty("os.name").toLowerCase().contains("windows")) {
			vmArg("-XX:HeapDumpPath=MojangTricksIntelDriversForPerformance_javaw.exe_minecraft.exe.heapdump")
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "rubidium-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
		username = "6a0"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	ext.includeModule = { name ->
		var module = fabricApi.module(name, project.fabric_version)
		implementation(module)
		include(module)
	}

	includeModule("fabric-api-base")
	includeModule("fabric-resource-loader-v1")
	includeModule("fabric-rendering-v1")
	includeModule("fabric-renderer-api-v1")
	includeModule("fabric-rendering-fluids-v1")
	includeModule("fabric-block-getter-api-v2")
	includeModule("fabric-lifecycle-events-v1")
	includeModule("fabric-transitive-access-wideners-v1")

	// Literal server IPs otherwise stall ~5s on a reverse DNS lookup when connecting
	gametestRuntimeOnly "maven.modrinth:fast-ip-ping:${project.fast_ip_ping_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// Benchmarks: production-like client runs driven by the client gametest in src/gametest.
// Usage: ./gradlew benchRubidium (or benchVanillaGl / benchVanillaVulkan / benchSodium)
// Results are written to build/run/bench/results/
def gametestJar = tasks.register("gametestJar", Jar) {
	archiveClassifier = "gametest"
	from sourceSets.gametest.output
}

configurations {
	benchBaseMods
	benchSodiumMods
}

dependencies {
	benchBaseMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	benchBaseMods "maven.modrinth:fast-ip-ping:${project.fast_ip_ping_version}"
	benchSodiumMods "maven.modrinth:sodium:${project.sodium_version}"
}

def registerBenchmark = { String name, String label, String backend, boolean withRubidium, boolean withSodium ->
	tasks.register(name, ClientProductionRunTask) {
		group = "benchmark"
		description = "Runs the client benchmark gametest: ${label}"

		// A benchmark is a measurement, never up to date
		outputs.upToDateWhen { false }

		mods.setFrom(gametestJar, configurations.benchBaseMods)
		if (withRubidium) {
			mods.from(tasks.named("jar"))
		}
		if (withSodium) {
			mods.from(configurations.benchSodiumMods)
		}

		// -PbenchJavaVendor=microsoft runs on a Microsoft OpenJDK 25 (e.g. Mojang's bundled runtime, made visible with
		// -Porg.gradle.java.installations.paths=<java home>) instead of the build JDK
		if (project.hasProperty("benchJavaVendor")) {
			javaLauncher = javaToolchains.launcherFor {
				languageVersion = JavaLanguageVersion.of(25)
				vendor = JvmVendorSpec.matching(project.property("benchJavaVendor").toString())
			}
		}

		runDir = layout.buildDirectory.dir("run/bench/${label}")
		// -PbenchProbe=SECONDS: diagnostic startup probe outside client gametest mode (see StartupProbe)
		if (project.hasProperty("benchProbe")) {
			jvmArgs.add("-Drubidium.bench.probeSeconds=${project.property("benchProbe")}")
		} else {
			jvmArgs.addAll("-Dfabric.client.gametest", "-Dfabric.client.gametest.modid=rubidium-gametest")
		}
		// Mojang's launcher JVM arguments for 26.3, which the production run task doesn't apply. Without the extra
		// stack shadow pages, native code (graphics drivers) intermittently overflowed thread stacks during startup,
		// killing the JVM with 0xC0000005 / 0xC0000409 / 0xC0000374 and no hs_err log.
		jvmArgs.addAll(
				"-XX:StackShadowPages=32",
				"--add-exports", "java.base/jdk.internal.misc=ALL-UNNAMED"
		)
		if (System.getProperty("os.name").toLowerCase().contains("windows")) {
			jvmArgs.add("-XX:HeapDumpPath=MojangTricksIntelDriversForPerformance_javaw.exe_minecraft.exe.heapdump")
		}

		jvmArgs.addAll(
				"-Drubidium.bench.label=${label}",
				// The benchmark keeps the displays awake via SetThreadExecutionState (FFM downcall)
				"--enable-native-access=ALL-UNNAMED",
				"-Xmx4G"
		)
		// -PbenchJfr records a Java Flight Recorder profile of the run into the results directory
		if (project.hasProperty("benchJfr")) {
			// -PbenchJfrPeriod=1ms samples more often than the profile setting's 10-20 ms (short phases, small costs)
			def period = project.findProperty("benchJfrPeriod")?.with { ",jdk.ExecutionSample#period=${it}" } ?: ""
			jvmArgs.add("-XX:StartFlightRecording=settings=profile${period},filename=../results/${label}.jfr,dumponexit=true")
		}
		// Forward -Pbench.* project properties as system properties (e.g. -Pbench.renderDistance=16)
		project.properties.findAll { it.key.startsWith("bench.") }.each { k, v ->
			jvmArgs.add("-Drubidium.${k}=${v}")
		}
		// Forward -Pvm.* project properties as mod system properties (e.g. -Pvm.retainedChests=false)
		project.properties.findAll { it.key.startsWith("vm.") }.each { k, v ->
			jvmArgs.add("-Drubidium.${k.substring(3)}=${v}")
		}
		// Forward -Pjvm.* project properties as plain system properties (e.g. -Pjvm.MC_DEBUG_ENABLED=true)
		project.properties.findAll { it.key.startsWith("jvm.") }.each { k, v ->
			jvmArgs.add("-D${k.substring(4)}=${v}")
		}
		// -PbenchWindow=WIDTHxHEIGHT (default 1920x1080)
		def (windowWidth, windowHeight) = project.findProperty("benchWindow")?.toString()?.split("x") ?: ["1920", "1080"]
		programArgs.addAll("--username", "6a0", "--width", windowWidth, "--height", windowHeight)
		if (backend != null) {
			programArgs.addAll("--graphicsBackend", backend)
		}

		doFirst {
			def eula = runDir.get().file("eula.txt").asFile
			eula.parentFile.mkdirs()
			eula.text = "eula=true\n"
		}
	}
}

registerBenchmark("benchVanillaGl", "vanilla-gl", "opengl", false, false)
registerBenchmark("benchVanillaVulkan", "vanilla-vulkan", "vulkan", false, false)
registerBenchmark("benchSodium", "sodium", null, false, true)
registerBenchmark("benchRubidium", "rubidium", "vulkan", true, false)
registerBenchmark("benchRubidiumGl", "rubidium-gl", "opengl", true, false)

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
