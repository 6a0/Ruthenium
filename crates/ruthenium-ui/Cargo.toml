[package]
name = "ruthenium-ui"
description = "Ruthenium's GUI: scale, draw lists with vanilla's sprite blits, widgets and screens (CPU side only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
fdsm = "0.8.0"
fdsm-ttf-parser = "0.2.0"
image = { version = "0.25", default-features = false }
nalgebra = "0.34"
rayon = "1.12"
rustybuzz = "0.20.1"
ruthenium-assets = { path = "../ruthenium-assets" }
ruthenium-javamath = { path = "../ruthenium-javamath" }
ruthenium-protocol = { path = "../ruthenium-protocol" }
ruthenium-sim = { path = "../ruthenium-sim" }
