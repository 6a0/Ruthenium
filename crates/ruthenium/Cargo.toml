[package]
name = "ruthenium"
description = "A PvP-focused Minecraft: Java Edition client written in Rust and Vulkan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Stream CPU zones and frame marks to the Tracy profiler.
tracy = ["profiling/profile-with-tracy", "ruthenium-gpu/tracy"]
# Build SDL3 from source and link it statically (always on for Windows and macOS).
sdl-static = ["ruthenium-platform/sdl-static"]
# Development only (PLAN D3): join offline-mode servers on this machine or the local
# network as an offline player, without an account. Never in release builds; CI checks.
dev-offline = ["ruthenium-net/dev-offline"]

[dependencies]
profiling = "1.0.18"
ruthenium-assets = { path = "../ruthenium-assets" }
ruthenium-audio = { path = "../ruthenium-audio", features = ["device"] }
ruthenium-auth = { path = "../ruthenium-auth" }
ruthenium-data = { path = "../ruthenium-data" }
ruthenium-gpu = { path = "../ruthenium-gpu" }
ruthenium-net = { path = "../ruthenium-net" }
ruthenium-platform = { path = "../ruthenium-platform" }
ruthenium-prepare = { path = "../ruthenium-prepare" }
ruthenium-protocol = { path = "../ruthenium-protocol" }
ruthenium-render = { path = "../ruthenium-render" }
ruthenium-sim = { path = "../ruthenium-sim" }
ruthenium-ui = { path = "../ruthenium-ui" }
serde_json = "1.0.154"
toml = "1.2.1"

[dev-dependencies]
base64 = "0.22.1"
tempfile = "3.27.0"
