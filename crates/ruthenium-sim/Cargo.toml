[package]
name = "ruthenium-sim"
description = "The game thread: the session with a server, its configuration and (to come) the simulation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ruthenium-audio = { path = "../ruthenium-audio" }
ruthenium-data = { path = "../ruthenium-data" }
ruthenium-prepare = { path = "../ruthenium-prepare" }
ruthenium-javamath = { path = "../ruthenium-javamath" }
ruthenium-net = { path = "../ruthenium-net" }
ruthenium-protocol = { path = "../ruthenium-protocol" }
rsa = { version = "0.10.0", features = ["pkcs1v15"] }
serde_json = "1.0.154"

[dev-dependencies]
ruthenium-assets = { path = "../ruthenium-assets" }
ruthenium-trace = { path = "../ruthenium-trace" }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
tempfile = "3.27.0"
