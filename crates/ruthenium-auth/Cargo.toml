[package]
name = "ruthenium-auth"
description = "Microsoft account sign-in for Minecraft: PKCE and device code, Xbox Live, XSTS, the Minecraft services, and the account keystore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22.1"
getrandom = "0.4.3"
keyring = "4.2.0"
rsa = { version = "0.10.0", features = ["pkcs1v15"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
ureq = { version = "3.5.2", features = ["json", "platform-verifier"] }

[dev-dependencies]
tempfile = "3.27.0"
