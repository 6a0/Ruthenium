[package]
name = "ruthenium-gpu"
description = "Ruthenium's Vulkan layer: device selection, swapchain, frame loop, memory, upload ring, texture table, pipelines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# GPU zones in the Tracy profiler (the client binary starts Tracy).
tracy = ["dep:tracy-client"]

[dependencies]
# "provisional" for the portability subset's feature and property structures (MoltenVK).
ash = { version = "0.38.0", default-features = false, features = ["std", "debug", "provisional"] }
profiling = "1.0.18"
tracy-client = { version = "0.18.5", optional = true }
